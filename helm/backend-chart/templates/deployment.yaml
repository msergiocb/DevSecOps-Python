apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend-chart.fullname" . | default "backend" }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | default "postgres" | quote }}
            - name: POSTGRES_PORT
              value: "{{ .Values.postgres.port | default 5432 }}"
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | default "postgrestest" | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | default "postgrespw" | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.db | default "appdb" | quote }}
