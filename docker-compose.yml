version: '3.8'
services:

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgrestest
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: appdb
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgrestest
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: appdb
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: "http://localhost:8000"

volumes:
  dbdata:
